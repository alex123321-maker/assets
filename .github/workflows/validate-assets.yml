name: Validate Asset Packages

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pillow numpy

      - name: Syntax check
        run: |
          python -m py_compile tools/validate_asset.py
          python -m py_compile tools/validate_all.py
          python -m py_compile tools/new_asset.py
          python -m py_compile tools/blender/build_voxel_asset.py
          python -m py_compile tools/blender/build_tree_family.py
          python -m py_compile tools/author_tree_oak.py
          python -m py_compile tools/create_tree_comparison_sheets.py
          python -m py_compile tools/author_terrain_materials.py
          python -m py_compile tools/generate_terrain_reference.py
          python -m py_compile tools/create_terrain_comparison_sheets.py
          python -m py_compile tools/blender/render_gameplay_mockup.py
          python -m py_compile tools/author_dressing_pack.py
          python -m py_compile tools/generate_dressing_reference.py
          python -m py_compile tools/create_dressing_comparison_sheets.py
          python -m py_compile tools/blender/build_dressing_pack.py
          python -m py_compile tools/author_hud_visual_kit.py
          python -m py_compile tools/hud_icons_builder.py
          python -m py_compile tools/hud_frames_builder.py
          python -m py_compile tools/hud_svg_builder.py
          python -m py_compile assets/ui/hud_visual_kit/source/generate_kit.py
          python -m py_compile tools/review_loop/*.py

      - name: Pipeline and review loop unit tests
        run: python -m unittest discover -s tests/unit -p "test_*.py"

      - name: Validate committed asset packages
        run: python tools/validate_all.py

      - name: Verify review package evidence
        run: python tools/verify_review_evidence.py

      - name: Verify build freshness and recorded visual review
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$PR_BASE_SHA" ]; then
            python tools/quality_gate.py check-all --base-ref "$PR_BASE_SHA"
          else
            python tools/quality_gate.py check-all
          fi

